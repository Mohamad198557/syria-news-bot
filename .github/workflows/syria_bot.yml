name: Syria Economic News

on:
  schedule:
    - cron: '10,40 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only (no Telegram messages)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: syria-economic-news
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Collect and publish
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PREVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          ENABLED: ${{ vars.ECONOMY_BOT_ENABLED }}
        run: |
          if [ "$PREVIEW" = "true" ] || [ "$ENABLED" != "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi
      - name: Persist confirmed deliveries even after a partial failure
        if: always()
        run: |
          if [ ! -f data/sent_economy.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent_economy.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Save delivered economic news [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase
            if git push; then exit 0; fi
            sleep 3
          done
          echo "Failed to persist delivery state; review before the next run."
          exit 1
      - name: Preserve state as recovery artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: economic-news-state-${{ github.run_id }}
          path: data/sent_economy.json
          retention-days: 30
